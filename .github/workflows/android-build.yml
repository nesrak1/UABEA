name: UABEA Android Build

on:
  push:
    branches: [ android-port ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore UABEA.Android/UABEA.Android.csproj

      - name: Publish ARM64 debug APK
        run: |
          set -euo pipefail
          dotnet publish UABEA.Android/UABEA.Android.csproj \
            -c Debug \
            -f net8.0-android31.0 \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false

          APK="$(find UABEA.Android/bin/Debug/net8.0-android31.0/android-arm64/publish -maxdepth 1 -type f -iname '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not produced."
            find UABEA.Android/bin/Debug/net8.0-android31.0/android-arm64/publish -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "$APK" UABEA-Mobile-unsigned.apk

      - name: Sign and verify debug APK
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          KEYSTORE="$RUNNER_TEMP/uabea-debug.keystore"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out UABEA-Mobile-debug.apk \
            UABEA-Mobile-unsigned.apk

          "$APKSIGNER" verify --verbose --print-certs UABEA-Mobile-debug.apk
          test -s UABEA-Mobile-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uabea-mobile-debug-apk
          path: UABEA-Mobile-debug.apk
          if-no-files-found: error
          compression-level: 0
