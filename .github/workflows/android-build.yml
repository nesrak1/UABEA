name: UABEA Android Build

on:
  push:
    branches: [ android-port ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore UABEA.Android/UABEA.Android.csproj

      - name: Build APK
        run: dotnet publish UABEA.Android/UABEA.Android.csproj -c Release -f net8.0-android31.0 -p:AndroidPackageFormat=apk -p:PublishTrimmed=false -p:RunAOTCompilation=false

      - name: Package complete source
        run: git archive --format=zip --output UABEA-Mobile-source.zip HEAD

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: uabea-mobile-build
          path: |
            UABEA.Android/bin/Release/net8.0-android34.0/publish/*.apk
            UABEA-Mobile-source.zip
          if-no-files-found: error
